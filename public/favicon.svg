<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Base background circle with dark border -->
  <circle cx="50" cy="50" r="46" fill="#ffffff" stroke="#232323" stroke-width="6"/>
  
  <!-- Top Red Dome -->
  <path d="M 4,50 A 46,46 0 0,1 96,50 Z" fill="#e52d2d" stroke="#232323" stroke-width="6"/>
  
  <!-- White Specular Highlight on Top Left -->
  <ellipse cx="30" cy="24" rx="11" ry="7" fill="#ffffff" transform="rotate(-25 30 24)"/>
  
  <!-- Bottom Shadow curve inside white half -->
  <path d="M 6,56 A 44,44 0 0,0 94,56 A 46,46 0 0,1 6,56 Z" fill="#a6a6a6"/>
  
  <!-- Horizontal Middle Black/Dark Grey Band -->
  <path d="M 4,45 H 96 V 55 H 4 Z" fill="#2b2b2b" stroke="#232323" stroke-width="2"/>
  
  <!-- Center Button Outer Dark Circle -->
  <circle cx="50" cy="50" r="16" fill="#2b2b2b" stroke="#232323" stroke-width="3"/>
  
  <!-- Center Button Inner White Circle -->
  <circle cx="50" cy="50" r="9" fill="#ffffff" stroke="#232323" stroke-width="3"/>
</svg>